name: Fetch pins
on:
  workflow_dispatch:
  push:
    paths:
      - assets/pins.txt
      - scripts/fetch_pins.py
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_pins.py
      - run: |
          git config user.name "first-light-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/pins
          git diff --cached --quiet || git commit -m "Add pins"
          git push
